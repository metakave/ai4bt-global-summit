<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <rect width="280" height="60" rx="8" fill="#ffffff" fill-opacity="0"/>
  <!-- Clock / Forward Sun Emblem -->
  <g transform="translate(6, 10)">
    <circle cx="20" cy="20" r="20" fill="#DC2626"/>
    <circle cx="20" cy="20" r="15" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
