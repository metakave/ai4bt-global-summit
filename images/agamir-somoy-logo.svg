  <text x="56" y="32" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', serif" font-weight="900" font-size="21" fill="#DC2626">দৈনিক <tspan fill="#0F172A">আগামীর সময়</tspan></text>
  <text x="57" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="1.5">AGAMIR SOMOY</text>
