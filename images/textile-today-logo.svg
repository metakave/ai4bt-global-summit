<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ttRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="ttBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Fabric Weave / Spool Icon Emblem -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#ttRedGrad)" />
    <!-- Stylized intersecting thread / loom pattern -->
    <path d="M16 20 C24 16, 36 16, 44 20 C36 28, 24 28, 16 36 C24 44, 36 44, 44 40" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="30" r="4.5" fill="#FED7AA" />
    <path d="M22 45 L38 45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Text: TEXTILE TODAY -->
  <g transform="translate(82, 0)">
    <!-- TEXTILE -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#0F172A">
      TEXTILE
    </text>
    <!-- TODAY -->
    <text x="156" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#E11D48">
      TODAY
    </text>
    <!-- Subtitle tagline -->
    <text x="2" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.2" fill="#64748B" text-transform="uppercase">
      GLOBAL TEXTILE &amp; APPAREL NEWS
    </text>
  </g>
</svg>
